name: 更新 FlowWatch Formula

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-flowwatch
  cancel-in-progress: false

jobs:
  update:
    name: 检查最新正式版本
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - id: formula
        name: 读取最新发布并生成 Formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/JunieXD/FlowWatch/releases/latest --jq .tag_name)"
          curl -fsSL --retry 3 \
            "https://github.com/JunieXD/FlowWatch/releases/download/${tag}/SHA256SUMS" \
            -o SHA256SUMS
          scripts/update-flowwatch.sh "$tag" SHA256SUMS Formula/flowwatch.rb
          rm SHA256SUMS
          echo "FLOWWATCH_TAG=$tag" >> "$GITHUB_ENV"
          if git diff --quiet -- Formula/flowwatch.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 挂载本地 Tap
        if: steps.formula.outputs.changed == 'true'
        run: brew tap JunieXD/tap "$GITHUB_WORKSPACE"
      - name: 检查 Formula 样式
        if: steps.formula.outputs.changed == 'true'
        run: brew style JunieXD/tap/flowwatch
      - name: 审计 Formula
        if: steps.formula.outputs.changed == 'true'
        run: brew audit --strict JunieXD/tap/flowwatch
      - name: 安装和测试
        if: steps.formula.outputs.changed == 'true'
        run: |
          brew install JunieXD/tap/flowwatch
          brew test JunieXD/tap/flowwatch
      - name: 提交变化
        if: steps.formula.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/flowwatch.rb
          git commit -m "flowwatch: update to ${FLOWWATCH_TAG}"
          git push
